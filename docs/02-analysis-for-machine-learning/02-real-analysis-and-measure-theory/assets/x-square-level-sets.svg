<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">x 平方按函数值分层示意图</title>
  <desc id="desc">示意函数 x 平方在负一到一上按函数值分层时，同一层对应左右两个区间。</desc>
  <rect width="900" height="460" fill="#fbfaf7"/>

  <g transform="translate(110 52)">
    <line x1="0" y1="300" x2="620" y2="300" stroke="#1f2937" stroke-width="2"/>
    <line x1="310" y1="300" x2="310" y2="26" stroke="#1f2937" stroke-width="2"/>
    <text x="560" y="326" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#374151">自变量 x</text>
    <text x="330" y="26" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#374151">函数值</text>

    <text x="0" y="326" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#374151">-1</text>
    <text x="310" y="326" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#374151">0</text>
    <text x="620" y="326" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#374151">1</text>
    <text x="286" y="306" text-anchor="end" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="15" fill="#374151">0</text>
    <text x="286" y="44" text-anchor="end" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="15" fill="#374151">1</text>

    <rect x="0" y="169" width="620" height="65" fill="#dbeafe" opacity="0.8"/>
    <line x1="0" y1="234" x2="620" y2="234" stroke="#60a5fa" stroke-width="2" stroke-dasharray="7 6"/>
    <line x1="0" y1="169" x2="620" y2="169" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="636" y="202" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="15" fill="#1d4ed8">函数值层：</text>
    <text x="636" y="224" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="15" fill="#1d4ed8">介于 1/4 和 1/2</text>

    <path d="M 0 40 C 96 205, 205 288, 310 300 C 415 288, 524 205, 620 40" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>

    <line x1="90.8" y1="300" x2="90.8" y2="234" stroke="#ef4444" stroke-width="2"/>
    <line x1="155" y1="300" x2="155" y2="169" stroke="#ef4444" stroke-width="2"/>
    <line x1="465" y1="300" x2="465" y2="169" stroke="#ef4444" stroke-width="2"/>
    <line x1="529.2" y1="300" x2="529.2" y2="234" stroke="#ef4444" stroke-width="2"/>

    <line x1="90.8" y1="300" x2="155" y2="300" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <line x1="465" y1="300" x2="529.2" y2="300" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>

    <text x="123" y="354" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="15" fill="#991b1b">左边一段</text>
    <text x="497" y="354" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="15" fill="#991b1b">右边一段</text>
    <text x="310" y="390" text-anchor="middle" font-family="Microsoft YaHei, SimHei, Arial, sans-serif" font-size="16" fill="#1f2937">按函数值分层时，同一层可以对应分散的两段</text>
  </g>
</svg>
