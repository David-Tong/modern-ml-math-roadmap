<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <rect width="900" height="430" fill="#ffffff"/>
  <style>
    text { font-family: "Microsoft YaHei", "SimHei", Arial, sans-serif; fill: #263044; }
    .title { font-size: 22px; font-weight: 700; }
    .label { font-size: 15px; fill: #5b667a; }
    .small { font-size: 13px; fill: #647086; }
    .axis { stroke: #263044; stroke-width: 1.6; }
    .grid { stroke: #d9e0eb; stroke-width: 1; }
    .spike { fill: #7fb3ff; opacity: 0.55; stroke: #1f6feb; stroke-width: 1.4; }
    .note { fill: #f8fafc; stroke: #d8deea; stroke-width: 1; rx: 8; }
  </style>

  <text x="250" y="34" class="title">尖峰越来越窄、越来越高，但面积不变</text>

  <g transform="translate(70 72)">
    <line x1="0" y1="290" x2="760" y2="290" class="axis"/>
    <line x1="0" y1="290" x2="0" y2="20" class="axis"/>
    <text x="764" y="295" class="label">x</text>
    <text x="-10" y="16" class="label">fₙ(x)</text>
    <text x="-4" y="314" class="small">0</text>
    <text x="740" y="314" class="small">1</text>

    <line x1="0" y1="230" x2="760" y2="230" class="grid"/>
    <line x1="0" y1="170" x2="760" y2="170" class="grid"/>
    <line x1="0" y1="110" x2="760" y2="110" class="grid"/>
    <line x1="0" y1="50" x2="760" y2="50" class="grid"/>

    <rect x="38" y="170" width="250" height="120" class="spike"/>
    <text x="96" y="160" class="label">n=3，高度 3，宽度 1/3</text>
    <text x="108" y="318" class="small">面积 = 1</text>

    <rect x="360" y="110" width="125" height="180" class="spike"/>
    <text x="330" y="98" class="label">n=6，高度 6，宽度 1/6</text>
    <text x="388" y="318" class="small">面积 = 1</text>

    <rect x="610" y="50" width="62" height="240" class="spike"/>
    <text x="572" y="38" class="label">n=12，高度 12，宽度 1/12</text>
    <text x="602" y="318" class="small">面积 = 1</text>

    <rect x="210" y="348" width="360" height="38" class="note"/>
    <text x="236" y="373" class="label">对固定 x&gt;0，尖峰最终会缩到它左边，所以 fₙ(x) → 0</text>
  </g>
</svg>
