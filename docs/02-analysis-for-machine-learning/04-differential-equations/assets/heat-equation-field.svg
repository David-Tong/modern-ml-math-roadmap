<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="title desc">
  <title id="title">Heat equation isotherms on the x-t plane</title>
  <desc id="desc">A two-dimensional isotherm diagram for u(x,t). The horizontal axis is position x, the vertical axis is time t, and each curve marks points with the same temperature.</desc>
  <rect width="780" height="460" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263241"/>
    </marker>
  </defs>

  <text x="92" y="42" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1f2937">热方程解的等温线图</text>

  <rect x="95" y="72" width="540" height="305" fill="#f8fafc" stroke="#263241" stroke-width="2"/>

  <!-- subtle time guide lines -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="95" y1="122" x2="635" y2="122"/>
    <line x1="95" y1="172" x2="635" y2="172"/>
    <line x1="95" y1="222" x2="635" y2="222"/>
    <line x1="95" y1="272" x2="635" y2="272"/>
    <line x1="95" y1="322" x2="635" y2="322"/>
  </g>

  <!-- isotherms for exp(-ct) sin(pi x/L)=constant. Higher temperatures are smaller closed caps near early time and the center. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M310 72 C322 102 408 102 420 72" stroke="#b91c1c" stroke-width="3.4"/>
    <path d="M268 72 C286 130 444 130 462 72" stroke="#dc2626" stroke-width="3.2"/>
    <path d="M232 72 C260 164 470 164 498 72" stroke="#f97316" stroke-width="3"/>
    <path d="M198 72 C238 204 492 204 532 72" stroke="#f59e0b" stroke-width="2.8"/>
    <path d="M166 72 C215 248 515 248 564 72" stroke="#22c55e" stroke-width="2.8"/>
    <path d="M132 72 C190 305 540 305 598 72" stroke="#0ea5e9" stroke-width="2.8"/>
  </g>

  <!-- axes -->
  <line x1="95" y1="398" x2="635" y2="398" stroke="#263241" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="72" y1="72" x2="72" y2="377" stroke="#263241" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="647" y="404" font-family="Arial, sans-serif" font-size="18" fill="#263241">x</text>
  <text x="55" y="65" font-family="Arial, sans-serif" font-size="18" fill="#263241">t</text>
  <text x="90" y="423" font-family="Arial, sans-serif" font-size="15" fill="#667085">0</text>
  <text x="623" y="423" font-family="Arial, sans-serif" font-size="15" fill="#667085">L</text>
  <text x="37" y="86" font-family="Arial, sans-serif" font-size="15" fill="#667085">早</text>
  <text x="37" y="377" font-family="Arial, sans-serif" font-size="15" fill="#667085">晚</text>

  <!-- center line and explanation point -->
  <line x1="365" y1="72" x2="365" y2="377" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 7"/>
  <text x="341" y="420" font-family="Arial, sans-serif" font-size="15" fill="#667085">中点 x=L/2</text>

  <circle cx="365" cy="164" r="5.5" fill="#111827"/>
  <text x="382" y="160" font-family="Arial, sans-serif" font-size="15" fill="#111827">一个 (x,t) 点对应一个温度 u</text>

  <!-- legend -->
  <g font-family="Arial, sans-serif" font-size="15" fill="#344054">
    <text x="662" y="116">等温线</text>
    <line x1="662" y1="136" x2="735" y2="136" stroke="#dc2626" stroke-width="3"/>
    <text x="662" y="166">温度较高</text>
    <line x1="662" y1="198" x2="735" y2="198" stroke="#0ea5e9" stroke-width="3"/>
    <text x="662" y="228">温度较低</text>
    <text x="662" y="276">同一条线上</text>
    <text x="662" y="298">u(x,t) 相同</text>
  </g>
</svg>
