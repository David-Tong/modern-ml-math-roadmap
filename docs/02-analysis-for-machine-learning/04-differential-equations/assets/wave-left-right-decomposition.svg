<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">初始条件决定左右行波</title>
  <desc id="desc">比较静止释放和带有平移速度的初始条件：前者分裂成左右相同的半幅波，后者形成主要向右传播的行波。</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#d7d2c8;stroke-width:1.2}.label{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:16px;font-weight:700;fill:#27221d}.small{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:13px;fill:#61584f}.tiny{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:12px;fill:#6b6258}.axis{stroke:#777;stroke-width:1.2}.grid{stroke:#e8e2d8;stroke-width:1}.initial{fill:none;stroke:#111827;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.right{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.left{fill:none;stroke:#e11d48;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:8 7}.ghost{fill:none;stroke:#9ca3af;stroke-width:2;stroke-dasharray:5 6}.arrow{stroke:#111827;stroke-width:1.4;fill:none;marker-end:url(#arr)}.note{fill:#fbfaf7;stroke:#ebe4d8;stroke-width:1}.formula{font-family:"Cambria Math","Times New Roman",serif;font-size:16px;fill:#27221d}.dot{fill:#111827}
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#111827"/></marker>
  </defs>
  <rect class="bg" width="980" height="520"/>
  <text class="label" x="40" y="36">初始条件怎样决定 F 和 G：左右行波可以相同，也可以不同</text>

  <rect class="panel" x="40" y="68" width="900" height="185" rx="8"/>
  <text class="label" x="62" y="100">例 A：只拉出形状，然后静止释放</text>
  <text class="formula" x="62" y="128">u(x,0)=f(x),  (∂u/∂t)(x,0)=0</text>
  <line class="axis" x1="72" y1="190" x2="390" y2="190"/>
  <path class="initial" d="M76 190 C125 190,150 190,170 188 C195 185,205 138,232 138 C259 138,269 185,294 188 C315 190,350 190,386 190"/>
  <text class="tiny" x="178" y="225">t=0：一个初始凸起</text>
  <path class="arrow" d="M420 176 H500"/>
  <line class="axis" x1="532" y1="190" x2="900" y2="190"/>
  <path class="left" d="M540 190 C582 190,598 190,612 188 C629 186,636 163,654 163 C672 163,679 186,696 188 C710 190,730 190,744 190"/>
  <path class="right" d="M700 190 C742 190,758 190,772 188 C789 186,796 163,814 163 C832 163,839 186,856 188 C870 190,890 190,900 190"/>
  <text class="tiny" x="612" y="225">t&gt;0：左右各一列，形状相同，高度各是一半</text>
  <rect class="note" x="62" y="230" width="820" height="18" rx="5"/>
  <text class="small" x="76" y="244">数学上：u = 1/2 f(x-ct) + 1/2 f(x+ct)，所以 F 和 G 是同一个初始形状的两半。</text>

  <rect class="panel" x="40" y="285" width="900" height="185" rx="8"/>
  <text class="label" x="62" y="317">例 B：初始速度正好让形状向右平移</text>
  <text class="formula" x="62" y="345">u(x,0)=f(x),  (∂u/∂t)(x,0)=-c f'(x)</text>
  <line class="axis" x1="72" y1="407" x2="390" y2="407"/>
  <path class="initial" d="M76 407 C125 407,150 407,170 405 C195 402,205 355,232 355 C259 355,269 402,294 405 C315 407,350 407,386 407"/>
  <path class="arrow" d="M210 355 H274"/>
  <text class="tiny" x="150" y="442">t=0：形状带着向右平移的速度</text>
  <path class="arrow" d="M420 393 H500"/>
  <line class="axis" x1="532" y1="407" x2="900" y2="407"/>
  <path class="ghost" d="M540 407 C582 407,598 407,612 405 C629 403,636 380,654 380 C672 380,679 403,696 405 C710 407,730 407,744 407"/>
  <path class="right" d="M664 407 C713 407,738 407,758 405 C783 402,793 355,820 355 C847 355,857 402,882 405 C900 407,910 407,918 407"/>
  <text class="tiny" x="604" y="442">t&gt;0：左行波被抵消，只剩向右传播的形状</text>
  <rect class="note" x="62" y="447" width="820" height="18" rx="5"/>
  <text class="small" x="76" y="461">数学上：u = f(x-ct)，也就是 F=f，G=0。这里左右行波就不相同。</text>
</svg>