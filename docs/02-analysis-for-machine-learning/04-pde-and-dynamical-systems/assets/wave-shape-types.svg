<svg xmlns="http://www.w3.org/2000/svg" width="980" height="410" viewBox="0 0 980 410" role="img" aria-labelledby="title desc">
  <title id="title">按波形形状给波分类</title>
  <desc id="desc">比较简谐波、脉冲波以及固定位置看到的时间信号。</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#d7d2c8;stroke-width:1.2}.label{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:16px;font-weight:700;fill:#27221d}.small{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:13px;fill:#61584f}.axis{stroke:#777;stroke-width:1.2}.grid{stroke:#e8e2d8;stroke-width:1}.blue{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.purple{fill:none;stroke:#7c3aed;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.red{fill:none;stroke:#e11d48;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.thin{fill:none;stroke:#8b7f70;stroke-width:1.5;stroke-dasharray:5 6}.mark{stroke:#111827;stroke-width:1.2;stroke-dasharray:4 5}.dot{fill:#111827}
    </style>
  </defs>
  <rect class="bg" width="980" height="410"/>
  <text class="label" x="40" y="36">分类法三：按波形形状，看“这一团扰动长什么样”</text>

  <rect class="panel" x="40" y="70" width="430" height="145" rx="8"/>
  <text class="label" x="62" y="100">简谐波：正弦或余弦形状</text>
  <line class="axis" x1="70" y1="156" x2="440" y2="156"/>
  <path class="blue" d="M70 156 C101 104,132 104,163 156 S225 208,256 156 S318 104,349 156 S411 208,440 156"/>
  <text class="small" x="72" y="198">如果这个正弦形状向右传播，就是简谐行波</text>

  <rect class="panel" x="510" y="70" width="430" height="145" rx="8"/>
  <text class="label" x="532" y="100">脉冲波：局部的一团扰动</text>
  <line class="axis" x1="540" y1="156" x2="910" y2="156"/>
  <path class="purple" d="M540 156 C594 156,622 156,642 154 C665 151,677 102,704 102 C731 102,743 151,766 154 C790 156,840 156,910 156"/>
  <text class="small" x="542" y="198">如果这团凸起向右传播，也是行波；但它不是驻波</text>

  <rect class="panel" x="40" y="245" width="430" height="125" rx="8"/>
  <text class="label" x="62" y="274">固定一个位置 x0：简谐波经过</text>
  <line class="axis" x1="70" y1="326" x2="440" y2="326"/>
  <line class="mark" x1="132" y1="292" x2="132" y2="354"/>
  <path class="red" d="M70 326 C101 286,132 286,163 326 S225 366,256 326 S318 286,349 326 S411 366,440 326"/>
  <text class="small" x="82" y="356">这个点看到的是周期振荡</text>

  <rect class="panel" x="510" y="245" width="430" height="125" rx="8"/>
  <text class="label" x="532" y="274">固定一个位置 x0：脉冲波经过</text>
  <line class="axis" x1="540" y1="326" x2="910" y2="326"/>
  <line class="mark" x1="704" y1="292" x2="704" y2="354"/>
  <path class="purple" d="M540 326 C598 326,628 326,648 324 C670 321,682 286,704 286 C726 286,738 321,760 324 C782 326,832 326,910 326"/>
  <text class="small" x="552" y="356">这个点先没动，波包到了才突然起伏</text>
</svg>