<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">特征线上的链式法则</title>
  <desc id="desc">在 x-t 平面中展示沿路径 x(t) 前进时，时间变化 dt 和空间移动 dx 如何共同贡献总变化率。</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#d7d2c8;stroke-width:1.2}.axis{stroke:#333;stroke-width:1.6}.grid{stroke:#e8e2d8;stroke-width:1}.char{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round}.step{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#arr)}.dash{stroke:#8b7f70;stroke-width:1.4;stroke-dasharray:5 6}.time{stroke:#e11d48;stroke-width:2.4;fill:none;marker-end:url(#arrRed)}.space{stroke:#0f766e;stroke-width:2.4;fill:none;marker-end:url(#arrGreen)}.dot{fill:#111827}.label{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:16px;font-weight:700;fill:#27221d}.small{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:13px;fill:#61584f}.formula{font-family:"Cambria Math","Times New Roman",serif;font-size:17px;fill:#27221d}.redText{fill:#b91c1c}.greenText{fill:#047857}.blueText{fill:#1d4ed8}.note{fill:#fbfaf7;stroke:#ebe4d8;stroke-width:1}
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#111827"/></marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#e11d48"/></marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#0f766e"/></marker>
  </defs>
  <rect class="bg" width="980" height="500"/>
  <text class="label" x="40" y="36">沿特征线看 u(x,t)：总变化 = 时间贡献 + 空间移动贡献</text>

  <rect class="panel" x="40" y="64" width="560" height="380" rx="8"/>
  <line class="grid" x1="110" y1="370" x2="520" y2="370"/>
  <line class="grid" x1="110" y1="290" x2="520" y2="290"/>
  <line class="grid" x1="110" y1="210" x2="520" y2="210"/>
  <line class="grid" x1="110" y1="130" x2="520" y2="130"/>
  <line class="grid" x1="190" y1="390" x2="190" y2="100"/>
  <line class="grid" x1="270" y1="390" x2="270" y2="100"/>
  <line class="grid" x1="350" y1="390" x2="350" y2="100"/>
  <line class="grid" x1="430" y1="390" x2="430" y2="100"/>
  <line class="axis" x1="110" y1="390" x2="520" y2="390" marker-end="url(#arr)"/>
  <line class="axis" x1="110" y1="390" x2="110" y2="92" marker-end="url(#arr)"/>
  <text class="small" x="522" y="396">x</text>
  <text class="small" x="98" y="88">t</text>

  <path class="char" d="M150 350 L470 110"/>
  <text class="small blueText" x="374" y="130">特征线 x=x0+ct</text>

  <circle class="dot" cx="270" cy="260" r="5"/>
  <circle class="dot" cx="350" cy="200" r="5"/>
  <text class="small" x="210" y="252">(x(t),t)</text>
  <text class="small" x="356" y="195">(x(t)+dx,t+dt)</text>

  <line class="time" x1="270" y1="260" x2="270" y2="200"/>
  <line class="space" x1="270" y1="200" x2="350" y2="200"/>
  <line class="dash" x1="350" y1="200" x2="350" y2="260"/>
  <line class="dash" x1="270" y1="260" x2="350" y2="260"/>
  <text class="small redText" x="232" y="232">dt</text>
  <text class="small greenText" x="306" y="188">dx=x'(t)dt</text>
  <text class="small" x="280" y="292">一小步里，时间和位置同时改变</text>

  <rect class="panel" x="635" y="64" width="305" height="380" rx="8"/>
  <text class="label" x="662" y="100">链式法则在算什么</text>
  <text class="small" x="662" y="135">沿蓝色路径走时，u 的变化量近似为：</text>
  <text class="formula" x="662" y="170">du ≈ u_t dt + u_x dx</text>
  <rect class="note" x="662" y="195" width="238" height="58" rx="6"/>
  <text class="small redText" x="678" y="218">u_t dt：</text>
  <text class="small" x="735" y="218">时间变化贡献</text>
  <text class="small" x="678" y="240">先只看 t 增加带来的变化</text>
  <rect class="note" x="662" y="270" width="238" height="72" rx="6"/>
  <text class="small greenText" x="678" y="294">u_x dx：</text>
  <text class="small" x="735" y="294">位置移动贡献</text>
  <text class="small" x="678" y="316">走到新位置后，空间高度</text>
  <text class="small" x="678" y="334">也会带来额外变化</text>
  <text class="small" x="662" y="374">除以 dt：</text>
  <text class="formula" x="662" y="405">d/dt u(x(t),t)=u_t+x'(t)u_x</text>
</svg>