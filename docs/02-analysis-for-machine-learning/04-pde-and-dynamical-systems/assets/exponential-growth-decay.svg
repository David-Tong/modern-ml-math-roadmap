<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">指数增长、保持和衰减</title>
  <desc id="desc">展示微分方程 dx/dt=ax 在 a 大于零、等于零和小于零时的三种轨迹，强调 a 小于零时轨迹趋近零而不是趋向负无穷。</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <line x1="82" y1="340" x2="660" y2="340" stroke="#333333" stroke-width="2"/>
  <line x1="82" y1="340" x2="82" y2="55" stroke="#333333" stroke-width="2"/>
  <path d="M660 340 L648 334 L648 346 Z" fill="#333333"/>
  <path d="M82 55 L76 67 L88 67 Z" fill="#333333"/>
  <text x="666" y="346" font-family="Arial, sans-serif" font-size="18" fill="#333333">t</text>
  <text x="48" y="52" font-family="Arial, sans-serif" font-size="18" fill="#333333">x(t)</text>
  <text x="61" y="362" font-family="Arial, sans-serif" font-size="16" fill="#333333">0</text>
  <text x="550" y="363" font-family="Arial, sans-serif" font-size="15" fill="#4b5563">x(t)=0</text>
  <line x1="82" y1="220" x2="660" y2="220" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="40" y="226" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">x(0)</text>
  <path d="M82 220 C170 213 248 194 322 164 C416 125 520 80 660 54" fill="none" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/>
  <path d="M82 220 L660 220" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M82 220 C166 246 252 276 344 302 C448 328 548 336 660 338" fill="none" stroke="#2f9e44" stroke-width="4" stroke-linecap="round"/>
  <circle cx="82" cy="220" r="5" fill="#111827"/>
  <rect x="430" y="92" width="205" height="94" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <line x1="450" y1="119" x2="490" y2="119" stroke="#d9480f" stroke-width="4" stroke-linecap="round"/>
  <text x="502" y="125" font-family="Arial, sans-serif" font-size="16" fill="#333333">a &gt; 0，增长</text>
  <line x1="450" y1="145" x2="490" y2="145" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="502" y="151" font-family="Arial, sans-serif" font-size="16" fill="#333333">a = 0，保持</text>
  <line x1="450" y1="171" x2="490" y2="171" stroke="#2f9e44" stroke-width="4" stroke-linecap="round"/>
  <text x="502" y="177" font-family="Arial, sans-serif" font-size="16" fill="#333333">a &lt; 0，趋近 0</text>
  <text x="150" y="392" font-family="Arial, sans-serif" font-size="16" fill="#4b5563">同一个方程 dx/dt = ax，参数 a 的符号决定长期行为</text>
</svg>