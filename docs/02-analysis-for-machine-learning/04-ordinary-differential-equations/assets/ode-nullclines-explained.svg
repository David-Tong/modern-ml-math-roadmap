<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-labelledby="title"><title id="title">零增长曲线：先判断方向，再看轨迹怎样经过</title><rect width="1080" height="480" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1e293b">
<text x="540" y="30" font-size="22" fill="#1e293b" text-anchor="middle">零增长曲线：先判断方向，再看轨迹怎样经过</text>
