<text x="359.405" y="273.944" font-size="15" fill="#64748b" text-anchor="middle">1</text>
<text x="289.881" y="190.833" font-size="15" fill="#2563eb" text-anchor="middle">蓝：−x + x²</text>
<text x="324.643" y="389.444" font-size="15" fill="#d97706" text-anchor="middle">橙：−x</text>
<text x="815" y="67" font-size="18" fill="#1e293b" text-anchor="middle">右：一次项为零，仍可能有相反趋势</text>
<text x="815" y="92" font-size="14" fill="#64748b" text-anchor="middle">两个例子的线性近似都是 y′ ≈ 0</text>
<text x="805" y="172" font-size="18" fill="#159568" text-anchor="middle">y′ = −y³：靠近零</text>
<polyline points="630,210 1000,210" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
<circle cx="815" cy="210" r="5" fill="#64748b"/>
<text x="815" y="239" font-size="16" fill="#1e293b" text-anchor="middle">0</text>
<text x="1020" y="215" font-size="16" fill="#1e293b" text-anchor="middle">y</text>
<polyline points="660,210 775,210" fill="none" stroke="#159568" stroke-width="2" stroke-linejoin="round"/>
<polygon points="775,210 767.796,213.48 767.796,206.52" fill="#159568"/>
<polyline points="970,210 855,210" fill="none" stroke="#159568" stroke-width="2" stroke-linejoin="round"/>
<polygon points="855,210 862.204,206.52 862.204,213.48" fill="#159568"/>
<text x="805" y="312" font-size="18" fill="#d97706" text-anchor="middle">y′ = y³：远离零</text>
<polyline points="630,350 1000,350" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>
<circle cx="815" cy="350" r="5" fill="#64748b"/>
<text x="815" y="379" font-size="16" fill="#1e293b" text-anchor="middle">0</text>
<text x="1020" y="355" font-size="16" fill="#1e293b" text-anchor="middle">y</text>
<polyline points="775,350 660,350" fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/>
<polygon points="660,350 667.204,346.52 667.204,353.48" fill="#d97706"/>
<polyline points="855,350 970,350" fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round"/>
<polygon points="970,350 962.796,353.48 962.796,346.52" fill="#d97706"/>
<text x="280" y="460" font-size="16" fill="#1e293b" text-anchor="middle">x 接近 0：两条线接近，方向一致。</text>
<text x="280" y="488" font-size="16" fill="#1e293b" text-anchor="middle">x &gt; 1：一个为正、一个为负，方向相反。</text>
<text x="815" y="460" font-size="16" fill="#1e293b" text-anchor="middle">不能只因一次项为零，就认定不动。</text>
<text x="815" y="488" font-size="16" fill="#1e293b" text-anchor="middle">此时要回到原方程，看三次项的正负号。</text></g></svg>