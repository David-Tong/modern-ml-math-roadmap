<title id="title">人口随时间的变化与一维相线</title>
<desc id="desc">方程 p'=p(1-p)。左图显示初值为零、0.5、1、1.5的时间曲线。右图以同样颜色标出初值，相线箭头表示正人口从两侧趋向1，零与1为平衡点。</desc>
