<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">无阻尼弹簧的向量场与一条解轨迹</title><desc id="desc">横轴为位置 x，纵轴为速度 v。蓝色箭头表示状态变化率 (v,-x)，橙色圆是从 (1,0) 出发的顺时针解轨迹，原点是平衡状态。</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3676a5"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d57228"/></marker></defs><rect width="960" height="560" fill="#fbfaf7"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#243443"><text x="35" y="38" font-size="23" font-weight="bold">向量场：每个状态都有一支“下一步怎么走”的箭头</text><text x="35" y="67" font-size="17">无阻尼弹簧  x′ = v，v′ = −x</text>
