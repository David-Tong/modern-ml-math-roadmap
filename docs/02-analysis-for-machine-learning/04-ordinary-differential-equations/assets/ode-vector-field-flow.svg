<circle cx="280" cy="305" r="95" fill="none" stroke="#d57228" stroke-width="2.7"/><path d="M 375 305 A 95 95 0 0 1 369.27 337.49" fill="none" stroke="#d57228" stroke-width="2.7" marker-end="url(#orange)"/><circle cx="375" cy="305" r="4.5" fill="#d57228"/><text x="388" y="292" font-size="15" fill="#b95a1b">起点 (1, 0)</text><circle cx="280" cy="305" r="4" fill="#243443"/><text x="290" y="293" font-size="13">0</text><text x="555" y="139" font-size="19" font-weight="bold" fill="#3676a5">蓝箭头：向量场</text><text x="555" y="173" font-size="17">在 (x, v) 处，箭头为 (v, −x)。</text><text x="555" y="204" font-size="17">向右或左：位置怎样变；</text><text x="555" y="234" font-size="17">向上或下：速度怎样变。</text><text x="555" y="291" font-size="19" font-weight="bold" fill="#b95a1b">橙色圆：一条解轨迹</text><text x="555" y="325" font-size="17">从 (1, 0) 出发，沿箭头顺时针走。</text><text x="555" y="355" font-size="17">每一点的箭头都与轨迹相切。</text><text x="555" y="412" font-size="17">原点：位置、速度都不再变化。</text><text x="555" y="445" font-size="17">箭头按同一比例缩放，</text><text x="555" y="475" font-size="17">越长表示状态变化越快。</text><text x="35" y="540" font-size="15" fill="#586877">这张图画的是“位置—速度”状态平面，不是弹簧在真实空间里绕圆运动。</text></g></svg>
