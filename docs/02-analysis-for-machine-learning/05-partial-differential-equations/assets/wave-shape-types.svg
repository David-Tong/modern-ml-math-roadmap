<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">按波形形状给波分类</title>
  <desc id="desc">比较简谐波、脉冲波，以及固定位置处看到的两种时间信号。</desc>
  <defs>
    <style>
      .bg{fill:#fbfaf7}.panel{fill:#fff;stroke:#d7d2c8;stroke-width:1.2}.label{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:16px;font-weight:700;fill:#27221d}.small{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:13px;fill:#61584f}.axis{stroke:#777;stroke-width:1.2}.grid{stroke:#e8e2d8;stroke-width:1}.blue{fill:none;stroke:#2563eb;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.purple{fill:none;stroke:#7c3aed;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.red{fill:none;stroke:#e11d48;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.mark{stroke:#111827;stroke-width:1.2;stroke-dasharray:4 5}.noteBox{fill:#fbfaf7;stroke:#ebe4d8;stroke-width:1}.tiny{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;font-size:12px;fill:#6b6258}
    </style>
  </defs>
  <rect class="bg" width="980" height="500"/>
  <text class="label" x="40" y="36">分类法三：按波形形状，看“这一团扰动长什么样”</text>

  <rect class="panel" x="40" y="70" width="430" height="180" rx="8"/>
  <text class="label" x="62" y="100">简谐波：正弦或余弦形状</text>
  <line class="axis" x1="70" y1="162" x2="440" y2="162"/>
  <line class="grid" x1="70" y1="124" x2="440" y2="124"/>
  <line class="grid" x1="70" y1="200" x2="440" y2="200"/>
  <path class="blue" d="M70 162 C101 110,132 110,163 162 S225 214,256 162 S318 110,349 162 S411 214,440 162"/>
  <rect class="noteBox" x="62" y="216" width="356" height="22" rx="5"/>
  <text class="small" x="76" y="232">如果这个正弦形状向右传播，就是简谐行波</text>

  <rect class="panel" x="510" y="70" width="430" height="180" rx="8"/>
  <text class="label" x="532" y="100">脉冲波：局部的一团扰动</text>
  <line class="axis" x1="540" y1="162" x2="910" y2="162"/>
  <line class="grid" x1="540" y1="124" x2="910" y2="124"/>
  <path class="purple" d="M540 162 C594 162,622 162,642 160 C665 157,677 112,704 112 C731 112,743 157,766 160 C790 162,840 162,910 162"/>
  <rect class="noteBox" x="532" y="216" width="372" height="22" rx="5"/>
  <text class="small" x="546" y="232">局部凸起可以向右传播，但它不是驻波</text>

  <rect class="panel" x="40" y="285" width="430" height="170" rx="8"/>
  <text class="label" x="62" y="315">固定一个位置 x0：简谐行波经过</text>
  <text class="tiny" x="382" y="315">横轴是时间 t</text>
  <line class="axis" x1="70" y1="372" x2="440" y2="372"/>
  <line class="grid" x1="70" y1="338" x2="440" y2="338"/>
  <line class="grid" x1="70" y1="406" x2="440" y2="406"/>
  <path class="red" d="M70 372 C101 332,132 332,163 372 S225 412,256 372 S318 332,349 372 S411 412,440 372"/>
  <rect class="noteBox" x="62" y="420" width="260" height="22" rx="5"/>
  <text class="small" x="76" y="436">这个点看到的是随时间正弦振荡</text>

  <rect class="panel" x="510" y="285" width="430" height="170" rx="8"/>
  <text class="label" x="532" y="315">固定一个位置 x0：脉冲波经过</text>
  <text class="tiny" x="852" y="315">横轴是时间 t</text>
  <line class="axis" x1="540" y1="372" x2="910" y2="372"/>
  <line class="grid" x1="540" y1="338" x2="910" y2="338"/>
  <line class="mark" x1="704" y1="330" x2="704" y2="414"/>
  <path class="purple" d="M540 372 C598 372,628 372,648 370 C670 367,682 330,704 330 C726 330,738 367,760 370 C782 372,832 372,910 372"/>
  <rect class="noteBox" x="532" y="420" width="318" height="22" rx="5"/>
  <text class="small" x="546" y="436">先平静，波包经过时才突然起伏</text>
</svg>