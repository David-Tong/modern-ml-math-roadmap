<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">Frank-Wolfe triangle example</title>
  <desc id="desc">A diagram of the Frank-Wolfe method on a triangular feasible region. The unconstrained minimizer is outside the triangle, the first linear subproblem selects the vertex (1,0), and the first iterate moves from (0,0) to (0.8,0) along a feasible segment.</desc>
  <rect width="820" height="500" fill="#ffffff"/>

  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <clipPath id="plot-clip">
      <rect x="0" y="0" width="450" height="370"/>
    </clipPath>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 21px; fill: #111827; font-weight: 700; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; fill: #52525b; }
      .axis { stroke: #71717a; stroke-width: 1.4; }
      .grid { stroke: #e4e4e7; stroke-width: 1; }
      .contour { fill: none; stroke: #f97316; stroke-width: 1.5; opacity: 0.72; }
      .contour-low { fill: none; stroke: #dc2626; stroke-width: 2; opacity: 0.8; }
      .contour-best { fill: none; stroke: #2563eb; stroke-width: 2.8; opacity: 0.9; }
      .tri { fill: rgba(37,99,235,0.10); stroke: #2563eb; stroke-width: 2.4; }
      .edge { stroke: #2563eb; stroke-width: 2.4; }
      .path { stroke: #16a34a; stroke-width: 4; marker-end: url(#arrow-green); }
      .path-next { fill: none; stroke: #7c3aed; stroke-width: 3.2; stroke-dasharray: 8 6; marker-end: url(#arrow-purple); }
      .dash { stroke: #dc2626; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrow-red); }
      .guide { stroke: #a1a1aa; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #111827; }
      .label-strong { font-family: Arial, sans-serif; font-size: 15px; fill: #111827; font-weight: 700; }
      .label-muted { font-family: Arial, sans-serif; font-size: 13px; fill: #52525b; }
      .label-blue { font-family: Arial, sans-serif; font-size: 14px; fill: #2563eb; font-weight: 700; }
      .label-green { font-family: Arial, sans-serif; font-size: 14px; fill: #16a34a; font-weight: 700; }
      .label-purple { font-family: Arial, sans-serif; font-size: 14px; fill: #7c3aed; font-weight: 700; }
      .label-red { font-family: Arial, sans-serif; font-size: 14px; fill: #dc2626; font-weight: 700; }
    </style>
  </defs>

  <text x="410" y="34" text-anchor="middle" class="title">Frank-Wolfe 方法的一步</text>
  <text x="410" y="60" text-anchor="middle" class="subtitle">在三角形可行域内，先由线性化目标选出可行点，再沿可行线段移动</text>

  <g transform="translate(44,82)">
    <rect x="0" y="0" width="450" height="370" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>

    <!-- Plot coordinates: X = 80 + 240x, Y = 320 - 240y. -->
    <line x1="80" y1="320" x2="370" y2="320" class="axis"/>
    <line x1="80" y1="320" x2="80" y2="38" class="axis"/>
    <line x1="80" y1="260" x2="340" y2="260" class="grid"/>
    <line x1="80" y1="200" x2="340" y2="200" class="grid"/>
    <line x1="80" y1="140" x2="340" y2="140" class="grid"/>
    <line x1="140" y1="320" x2="140" y2="60" class="grid"/>
    <line x1="200" y1="320" x2="200" y2="60" class="grid"/>
    <line x1="260" y1="320" x2="260" y2="60" class="grid"/>
    <line x1="320" y1="320" x2="320" y2="60" class="grid"/>

    <g clip-path="url(#plot-clip)">
      <circle cx="272" cy="176" r="48" class="contour-low"/>
      <circle cx="272" cy="176" r="68" class="contour-best"/>
      <circle cx="272" cy="176" r="84" class="contour"/>
      <circle cx="272" cy="176" r="120" class="contour"/>
      <circle cx="272" cy="176" r="156" class="contour"/>
      <circle cx="272" cy="176" r="192" class="contour"/>
    </g>
    <text x="286" y="118" class="label-red">f 值低</text>
    <text x="340" y="248" class="label-muted">等高线</text>

    <polygon points="80,320 320,320 80,80" class="tri"/>
    <text x="182" y="190" text-anchor="middle" class="label-blue">可行域 C</text>
    <text x="326" y="340" class="label">(1,0)</text>
    <text x="46" y="78" class="label">(0,1)</text>
    <text x="52" y="340" class="label">(0,0)</text>
    <text x="316" y="76" class="label-muted">x+y=1</text>

    <circle cx="80" cy="320" r="6.5" fill="#111827"/>
    <text x="94" y="311" class="label-strong">x₀=(0,0)</text>

    <circle cx="320" cy="320" r="6.5" fill="#2563eb"/>
    <text x="270" y="306" class="label-blue">s₀=(1,0)</text>

    <line x1="80" y1="320" x2="320" y2="320" class="path"/>
    <circle cx="272" cy="320" r="7" fill="#16a34a"/>
    <text x="235" y="350" class="label-green">x₁=(0.8,0)</text>
    <path d="M272 320 C248 296, 234 270, 228 246 C225 235, 224 228, 224 224" class="path-next"/>
    <circle cx="236" cy="260" r="4.5" fill="#7c3aed"/>
    <circle cx="226" cy="238" r="4.5" fill="#7c3aed"/>
    <text x="248" y="273" class="label-purple">后续迭代示意</text>

    <circle cx="272" cy="176" r="7" fill="#dc2626"/>
    <text x="286" y="171" class="label-red">无约束最低点</text>
    <text x="286" y="190" class="label-muted">(0.8,0.6)，在 C 外</text>
    <circle cx="224" cy="224" r="7" fill="#2563eb"/>
    <text x="236" y="219" class="label-blue">约束下最低点</text>
    <text x="236" y="238" class="label-muted">(0.6,0.4)</text>
    <line x1="272" y1="176" x2="272" y2="272" class="guide"/>
    <line x1="80" y1="320" x2="205" y2="226" class="dash"/>
    <text x="139" y="219" class="label-red">-∇f(x₀)</text>

    <text x="198" y="294" class="label-muted">第一步沿可行线段移动</text>
    <text x="112" y="356" class="label-muted">α₀=0.8</text>
  </g>

  <g transform="translate(535,112)">
    <text x="0" y="0" class="label-strong">线性子问题</text>
    <text x="0" y="34" class="label-muted">在 x₀=(0,0) 处：</text>
    <text x="0" y="62" class="label">∇f(x₀)=(-1.6,-1.2)</text>
    <text x="0" y="105" class="label-muted">比较三个顶点：</text>
    <text x="0" y="136" class="label">(0,0) → 0</text>
    <text x="0" y="166" class="label-blue">(1,0) → -1.6</text>
    <text x="0" y="196" class="label">(0,1) → -1.2</text>
    <text x="0" y="240" class="label-muted">最小的是 (1,0)，</text>
    <text x="0" y="266" class="label-muted">所以 s₀=(1,0)。</text>
    <text x="0" y="304" class="label-green">第一步：x₁=(0.8,0)</text>
    <text x="0" y="332" class="label-purple">后续沿可行线段逼近蓝点</text>
  </g>
</svg>
