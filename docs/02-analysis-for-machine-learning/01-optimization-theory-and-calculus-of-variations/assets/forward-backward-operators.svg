<svg xmlns="http://www.w3.org/2000/svg" width="860" height="410" viewBox="0 0 860 410" role="img" aria-labelledby="title desc">
  <title id="title">前向算子与反向算子一一对应</title>
  <desc id="desc">上方展示用户定义的前馈网络如何传数值；下方展示框架按算子规则生成的反馈网络如何传导数。</desc>
  <rect width="860" height="410" fill="#ffffff"/>
  <defs>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 22px; fill: #111827; font-weight: 700; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 14px; fill: #52525b; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 14px; fill: #111827; }
      .small { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; fill: #475569; }
      .blue { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #2563eb; font-weight: 700; }
      .green { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #059669; font-weight: 700; }
      .orange { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 14px; fill: #ea580c; font-weight: 700; }
      .node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
      .op { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.7; rx: 8; }
      .grad { fill: #f0fdf4; stroke: #34d399; stroke-width: 1.7; rx: 8; }
      .param { fill: #fff7ed; stroke: #fdba74; stroke-width: 1.5; rx: 7; }
      .forward { stroke: #2563eb; stroke-width: 2.4; fill: none; marker-end: url(#arrow-blue); }
      .backward { stroke: #059669; stroke-width: 2.4; fill: none; marker-end: url(#arrow-green); }
      .guide { stroke: #e2e8f0; stroke-width: 1.2; stroke-dasharray: 5 6; }
    </style>
  </defs>

  <text x="430" y="34" text-anchor="middle" class="title">前向算子与反向算子一一对应</text>
  <text x="430" y="59" text-anchor="middle" class="subtitle">定义前馈网络时，框架同时确定对应的反馈网络：前馈传数值，反馈传导数。</text>

  <g transform="translate(42,94)">
    <text x="0" y="-18" class="blue">前馈网络：传数值（用户定义）</text>

    <rect x="0" y="0" width="100" height="48" class="param"/>
    <text x="50" y="29" text-anchor="middle" class="orange">x, w, b</text>

    <rect x="135" y="0" width="112" height="48" class="op"/>
    <text x="191" y="20" text-anchor="middle" class="label">乘法算子</text>
    <text x="191" y="38" text-anchor="middle" class="small">u = wx</text>

    <rect x="282" y="0" width="112" height="48" class="op"/>
    <text x="338" y="20" text-anchor="middle" class="label">加法算子</text>
    <text x="338" y="38" text-anchor="middle" class="small">z = u + b</text>

    <rect x="429" y="0" width="112" height="48" class="op"/>
    <text x="485" y="20" text-anchor="middle" class="label">激活算子</text>
    <text x="485" y="38" text-anchor="middle" class="small">ŷ = σ(z)</text>

    <rect x="576" y="0" width="112" height="48" class="op"/>
    <text x="632" y="20" text-anchor="middle" class="label">损失算子</text>
    <text x="632" y="38" text-anchor="middle" class="small">L = loss(ŷ,y)</text>

    <rect x="723" y="0" width="76" height="48" class="node"/>
    <text x="761" y="29" text-anchor="middle" class="label">L</text>

    <path d="M 100 24 L 135 24" class="forward"/>
    <path d="M 247 24 L 282 24" class="forward"/>
    <path d="M 394 24 L 429 24" class="forward"/>
    <path d="M 541 24 L 576 24" class="forward"/>
    <path d="M 688 24 L 723 24" class="forward"/>

    <line x1="191" y1="56" x2="191" y2="126" class="guide"/>
    <line x1="338" y1="56" x2="338" y2="126" class="guide"/>
    <line x1="485" y1="56" x2="485" y2="126" class="guide"/>
    <line x1="632" y1="56" x2="632" y2="126" class="guide"/>

    <text x="400" y="100" text-anchor="middle" class="small">每个前向算子都有一个对应的反向算子</text>

    <text x="0" y="130" class="green">反馈网络：传导数（框架生成）</text>

    <rect x="723" y="148" width="76" height="48" class="grad"/>
    <text x="761" y="176" text-anchor="middle" class="label">∂L/∂L = 1</text>

    <rect x="576" y="148" width="112" height="48" class="grad"/>
    <text x="632" y="168" text-anchor="middle" class="label">损失反向</text>
    <text x="632" y="186" text-anchor="middle" class="small">得到 ∂L/∂ŷ</text>

    <rect x="429" y="148" width="112" height="48" class="grad"/>
    <text x="485" y="168" text-anchor="middle" class="label">激活反向</text>
    <text x="485" y="186" text-anchor="middle" class="small">得到 ∂L/∂z</text>

    <rect x="282" y="148" width="112" height="48" class="grad"/>
    <text x="338" y="168" text-anchor="middle" class="label">加法反向</text>
    <text x="338" y="186" text-anchor="middle" class="small">传给 u 和 b</text>

    <rect x="135" y="148" width="112" height="48" class="grad"/>
    <text x="191" y="168" text-anchor="middle" class="label">乘法反向</text>
    <text x="191" y="186" text-anchor="middle" class="small">传给 w 和 x</text>

    <rect x="0" y="148" width="100" height="48" class="param"/>
    <text x="50" y="168" text-anchor="middle" class="orange">参数梯度</text>
    <text x="50" y="186" text-anchor="middle" class="small">∂L/∂w, ∂L/∂b</text>

    <path d="M 723 172 L 688 172" class="backward"/>
    <path d="M 576 172 L 541 172" class="backward"/>
    <path d="M 429 172 L 394 172" class="backward"/>
    <path d="M 282 172 L 247 172" class="backward"/>
    <path d="M 135 172 L 100 172" class="backward"/>

    <text x="400" y="248" text-anchor="middle" class="small">前馈图从左到右传数值；反馈图按相反顺序传导数，并把梯度送回参数。</text>
  </g>
</svg>
