<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Saddle point cross sections</title>
  <desc id="desc">Two cross sections of f(x,y)=x^2-y^2 near the origin. One direction bends upward and the other bends downward.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#444"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <text x="360" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#111">
    鞍点的两个截面：f(x,y)=x²-y²
  </text>
  <text x="360" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555">
    两个截面在同一个鞍点相交：一个方向上升，另一个方向下降
  </text>

  <line x1="70" y1="230" x2="650" y2="230" stroke="#d4d4d8" stroke-width="1.5"/>
  <line x1="360" y1="360" x2="360" y2="95" stroke="#d4d4d8" stroke-width="1.5"/>

  <path d="M 110 115 C 185 165, 260 230, 360 230 C 460 230, 535 165, 610 115"
        fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M 110 345 C 185 295, 260 230, 360 230 C 460 230, 535 295, 610 345"
        fill="none" stroke="#dc2626" stroke-width="4"/>

  <circle cx="360" cy="230" r="7" fill="#111"/>
  <line x1="360" y1="230" x2="360" y2="115" stroke="#111" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.65"/>
  <line x1="360" y1="230" x2="360" y2="345" stroke="#111" stroke-width="1.2" stroke-dasharray="5 5" opacity="0.65"/>

  <text x="372" y="224" font-family="Arial, sans-serif" font-size="14" fill="#111">鞍点</text>

  <line x1="155" y1="330" x2="285" y2="248" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="80" y="356" font-family="Arial, sans-serif" font-size="15" fill="#2563eb">
    沿 x 方向：离开鞍点，函数值上升
  </text>

  <line x1="565" y1="122" x2="440" y2="212" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="425" y="100" font-family="Arial, sans-serif" font-size="15" fill="#dc2626">
    沿 y 方向：离开鞍点，函数值下降
  </text>

  <line x1="95" y1="230" x2="635" y2="230" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="642" y="235" font-family="Arial, sans-serif" font-size="14" fill="#444">截面方向</text>
</svg>
