<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" role="img" aria-labelledby="title desc">
  <title id="title">最速下降曲线的摆线表示</title>
  <desc id="desc">从原点到较低终点的一段摆线，标出 x 轴、y 轴、终点 L,H、参数 theta 和切线角 alpha。</desc>
  <rect width="820" height="430" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#52525b"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/>
    </marker>
    <style>
      .title { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 22px; fill: #111827; font-weight: 700; }
      .subtitle { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 14px; fill: #52525b; }
      .axis { stroke: #52525b; stroke-width: 1.6; marker-end: url(#arrow); }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .curve { fill: none; stroke: #2563eb; stroke-width: 4.2; stroke-linecap: round; stroke-linejoin: round; }
      .straight { stroke: #94a3b8; stroke-width: 2.3; stroke-dasharray: 7 7; }
      .guide { stroke: #71717a; stroke-width: 1.3; stroke-dasharray: 5 6; }
      .angle { fill: none; stroke: #059669; stroke-width: 2.3; marker-end: url(#arrow-green); }
      .tangent { stroke: #059669; stroke-width: 2.5; stroke-dasharray: 6 5; }
      .point { fill: #111827; stroke: #ffffff; stroke-width: 2; }
      .point-blue { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
      .label { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #111827; }
      .label-muted { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 13px; fill: #52525b; }
      .label-blue { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #2563eb; font-weight: 700; }
      .label-orange { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 14px; fill: #f97316; font-weight: 700; }
      .label-purple { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #7c3aed; font-weight: 700; }
      .label-green { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 15px; fill: #059669; font-weight: 700; }
      .formula { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; font-size: 16px; fill: #111827; }
    </style>
  </defs>

  <text x="430" y="36" text-anchor="middle" class="title">最速下降曲线：摆线参数示意</text>
  <text x="430" y="61" text-anchor="middle" class="subtitle">图中把向下方向记为 y 的正方向，蓝色曲线表示最速下降轨道。</text>

  <g transform="translate(0,8)">
    <rect x="62" y="58" width="735" height="285" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>

    <line x1="90" y1="70" x2="760" y2="70" class="axis"/>
    <line x1="90" y1="70" x2="90" y2="326" class="axis"/>
    <text x="770" y="75" class="label">x</text>
    <text x="78" y="337" class="label">y</text>
    <text x="108" y="94" class="label-muted">向下为正</text>

    <line x1="90" y1="130" x2="760" y2="130" class="grid"/>
    <line x1="90" y1="190" x2="760" y2="190" class="grid"/>
    <line x1="90" y1="250" x2="760" y2="250" class="grid"/>
    <line x1="210" y1="70" x2="210" y2="326" class="grid"/>
    <line x1="330" y1="70" x2="330" y2="326" class="grid"/>
    <line x1="450" y1="70" x2="450" y2="326" class="grid"/>
    <line x1="570" y1="70" x2="570" y2="326" class="grid"/>

    <path d="M 90.0 70.0 L 90.0 70.1 L 90.0 70.5 L 90.1 71.2 L 90.2 72.1 L 90.4 73.3 L 90.6 74.7 L 91.0 76.4 L 91.5 78.3 L 92.1 80.5 L 92.9 82.8 L 93.8 85.4 L 95.0 88.2 L 96.3 91.2 L 97.8 94.3 L 99.5 97.6 L 101.5 101.0 L 103.7 104.6 L 106.1 108.3 L 108.8 112.0 L 111.7 115.9 L 114.9 119.8 L 118.3 123.8 L 122.0 127.8 L 126.0 131.8 L 130.3 135.7 L 134.8 139.7 L 139.6 143.6 L 144.6 147.5 L 149.9 151.3 L 155.4 155.0 L 161.2 158.5 L 167.2 162.0 L 173.5 165.3 L 180.0 168.5 L 186.6 171.4 L 193.5 174.2 L 200.5 176.8 L 207.7 179.2 L 215.1 181.4 L 222.6 183.4 L 230.2 185.1 L 237.9 186.5 L 245.7 187.7 L 253.6 188.7 L 261.5 189.4 L 269.5 189.8 L 277.5 190.0 L 285.5 189.9 L 293.5 189.5 L 301.4 188.9 L 309.3 188.0 L 317.2 186.9 L 324.9 185.5 L 332.6 183.8 L 340.1 181.9 L 347.5 179.8 L 354.7 177.5 L 361.8 174.9 L 368.7 172.2 L 375.4 169.2" class="curve"/>
    <line x1="90" y1="70" x2="375.4" y2="169.2" class="straight"/>

    <line x1="375.4" y1="70" x2="375.4" y2="169.2" class="guide"/>
    <line x1="90" y1="169.2" x2="375.4" y2="169.2" class="guide"/>
    <text x="224" y="188" class="label-blue">L</text>
    <text x="388" y="123" class="label-blue">H</text>

    <circle cx="90" cy="70" r="6.5" class="point"/>
    <text x="70" y="57" class="label">(0,0)</text>
    <circle cx="375.4" cy="169.2" r="7" class="point"/>
    <text x="385" y="198" class="label">(L,H)</text>
    <line x1="328" y1="186" x2="421" y2="152" class="tangent"/>
    <path d="M 398 169 A 23 23 0 0 0 389 157" class="angle"/>
    <text x="404" y="159" class="label-green">&#945;</text>

    <circle cx="173.5" cy="165.3" r="6" class="point-blue"/>
    <line x1="173.5" y1="70" x2="173.5" y2="165.3" class="guide"/>
    <text x="184" y="164" class="label-purple">&#952;</text>
    <text x="128" y="210" class="label-blue">参数 &#952; 对应的曲线点</text>

    <text x="455" y="132" class="formula">x = a(&#952; - sin &#952;)</text>
    <text x="455" y="160" class="formula">y = a(1 - cos &#952;)</text>
    <text x="455" y="204" class="label-muted">灰色虚线：直线路径</text>
    <text x="455" y="230" class="label-muted">蓝色曲线：最速下降路径</text>
  </g>
</svg>
