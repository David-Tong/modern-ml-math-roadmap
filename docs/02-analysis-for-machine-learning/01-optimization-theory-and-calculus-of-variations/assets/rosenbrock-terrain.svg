<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Rosenbrock banana valley</title>
  <desc id="desc">A two-panel schematic of the Rosenbrock function. Both panels show high terrain on both sides, a narrow curved valley in the middle, and the minimum inside the valley near the middle right.</desc>
  <rect width="900" height="560" fill="#ffffff"/>

  <defs>
    <linearGradient id="terrain-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.34" stop-color="#f97316"/>
      <stop offset="0.62" stop-color="#facc15"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="trough-fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset="0.62" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="legend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626"/>
      <stop offset="0.24" stop-color="#f97316"/>
      <stop offset="0.50" stop-color="#2563eb"/>
      <stop offset="0.76" stop-color="#f97316"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <marker id="arrow-black" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111827"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 22px; fill: #111827; font-weight: 700; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; fill: #52525b; }
      .panel-title { font-family: Arial, sans-serif; font-size: 16px; fill: #111827; font-weight: 700; }
      .label { font-family: Arial, sans-serif; font-size: 13px; fill: #111827; font-weight: 600; }
      .note { font-family: Arial, sans-serif; font-size: 12px; fill: #52525b; }
      .surface-edge { fill: #f8fafc; stroke: #e5e7eb; stroke-width: 1.2; }
      .mesh { fill: none; stroke: rgba(55,65,81,0.24); stroke-width: 1; }
      .ridge { fill: rgba(220,38,38,0.35); stroke: rgba(185,28,28,0.72); stroke-width: 1.2; }
      .slope { fill: url(#terrain-fill); opacity: 0.88; }
      .trough { fill: url(#trough-fill); opacity: 0.92; stroke: #1d4ed8; stroke-width: 1.6; }
      .trough-line { fill: none; stroke: #1d4ed8; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 9 7; }
      .contour-low { fill: none; stroke: #2563eb; stroke-width: 2.3; }
      .contour-mid { fill: none; stroke: #facc15; stroke-width: 1.9; }
      .contour-high { fill: none; stroke: #f97316; stroke-width: 1.8; }
      .contour-very-high { fill: none; stroke: #dc2626; stroke-width: 1.8; }
      .path-fixed { fill: none; stroke: #111827; stroke-width: 3.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-black); }
      .path-adapt { fill: none; stroke: #7c3aed; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-purple); }
    </style>
  </defs>

  <text x="450" y="32" text-anchor="middle" class="title">Rosenbrock 函数的狭长弯谷</text>
  <text x="450" y="58" text-anchor="middle" class="subtitle">示意图：两侧是高山，中间是一条弯曲沟谷，沟谷缓缓下降到中间偏右的最低点</text>

  <g transform="translate(38,86)">
    <text x="174" y="0" text-anchor="middle" class="panel-title">地形示意：南北两侧高，中间是一条沟</text>
    <path d="M38 338 L86 78 L360 78 L400 338 L219 388 Z" class="surface-edge"/>
    <path d="M63 318 L103 105 L345 105 L374 318 C296 348, 155 348, 63 318 Z" class="slope"/>
    <path d="M82 112 C133 94, 205 90, 281 95 C319 98, 350 107, 360 123 L351 161 C291 145, 222 140, 154 150 C116 156, 91 169, 74 185 Z" class="ridge"/>
    <path d="M65 288 C115 307, 179 316, 244 312 C303 308, 350 294, 375 270 L374 318 C296 348, 155 348, 63 318 Z" class="ridge"/>
    <path d="M86 247 C123 221, 161 204, 202 197 C239 191, 278 198, 337 225 C318 240, 286 250, 248 253 C198 257, 136 253, 86 247 Z" class="trough"/>
    <path d="M98 244 C139 221, 174 207, 211 202 C252 196, 292 207, 326 230" class="trough-line"/>

    <path d="M80 138 C136 122, 212 118, 290 123 C321 126, 345 132, 358 143" class="mesh"/>
    <path d="M75 180 C128 164, 202 158, 278 164 C320 168, 354 180, 371 199" class="mesh"/>
    <path d="M70 220 C123 206, 195 199, 269 206 C318 211, 357 228, 376 252" class="mesh"/>
    <path d="M70 282 C124 300, 188 307, 253 302 C309 298, 353 285, 377 263" class="mesh"/>
    <path d="M125 105 C111 170, 105 236, 101 313" class="mesh"/>
    <path d="M195 101 C185 165, 180 235, 177 333" class="mesh"/>
    <path d="M265 101 C263 168, 265 238, 271 333" class="mesh"/>
    <path d="M332 105 C345 172, 354 236, 365 313" class="mesh"/>

    <circle cx="326" cy="230" r="6.5" fill="#dc2626"/>
    <text x="338" y="226" class="label">最低点</text>
    <text x="70" y="374" class="note">红色山壁在上、下两侧</text>
    <text x="230" y="374" class="note">蓝色沟槽完全嵌在橙色区域里</text>
    <rect x="88" y="405" width="142" height="10" fill="url(#legend)" rx="2"/>
    <text x="238" y="415" class="note">高-低-高</text>
  </g>

  <g transform="translate(500,86)">
    <text x="170" y="0" text-anchor="middle" class="panel-title">俯视示意：等高线向中间谷底收缩</text>
    <rect x="0" y="28" width="340" height="340" fill="#ffffff" stroke="#d1d5db"/>

    <path d="M24 315 C64 233, 126 168, 194 134 C267 98, 329 125, 334 204 C339 291, 277 346, 187 353 C102 360, 39 349, 24 315 Z" class="contour-very-high"/>
    <path d="M43 295 C81 233, 135 185, 198 158 C258 132, 309 154, 313 213 C317 280, 264 322, 191 329 C119 336, 57 322, 43 295 Z" class="contour-high"/>
    <path d="M66 272 C100 228, 145 199, 198 181 C245 165, 285 181, 290 224 C295 271, 255 298, 198 304 C139 310, 81 294, 66 272 Z" class="contour-high"/>
    <path d="M94 248 C123 220, 160 207, 201 204 C236 202, 263 214, 266 234 C270 260, 238 277, 194 280 C149 283, 106 268, 94 248 Z" class="contour-mid"/>
    <path d="M124 228 C149 214, 178 213, 207 218 C236 223, 253 232, 252 244 C251 258, 228 266, 192 263 C159 260, 131 246, 124 228 Z" class="contour-mid"/>
    <path d="M157 218 C178 212, 199 216, 220 225 C241 234, 248 242, 242 249 C235 258, 211 258, 188 251 C168 245, 155 230, 157 218 Z" class="contour-low"/>

    <path d="M55 285 C98 245, 136 220, 176 211 C210 203, 238 219, 225 240" class="trough-line"/>

    <path d="M42 82 L93 220 L70 169 L124 258 L100 217 L160 236 L137 204 L198 225 L176 205 L215 225 L225 240" class="path-fixed"/>
    <path d="M42 82 C74 166, 111 215, 153 210 C190 206, 216 219, 225 240" class="path-adapt"/>

    <circle cx="42" cy="82" r="5.5" fill="#111827"/>
    <text x="54" y="73" class="label">起点：高处</text>
    <circle cx="225" cy="240" r="7" fill="#dc2626"/>
    <text x="238" y="237" class="label">最低点 (1,1)</text>

    <line x1="0" y1="405" x2="48" y2="405" stroke="#111827" stroke-width="3.1" stroke-linecap="round"/>
    <text x="60" y="409" class="note">A 固定坐标试探：反复横穿谷底</text>
    <line x1="0" y1="430" x2="48" y2="430" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>
    <text x="60" y="434" class="note">B 方向调整：进入谷底后顺谷下降</text>
  </g>
</svg>
