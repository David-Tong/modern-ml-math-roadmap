<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Rosenbrock function surface and contours</title>
  <desc id="desc">A two-panel diagram of the Rosenbrock function. The left panel shows a perspective surface with a narrow banana-shaped valley. The right panel shows contour lines and three illustrative search routes.</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <defs>
    <linearGradient id="surface-hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="0.28" stop-color="#ef4444"/>
      <stop offset="0.58" stop-color="#f59e0b"/>
      <stop offset="0.82" stop-color="#fde047"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="surface-cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="legend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.52" stop-color="#fde047"/>
      <stop offset="0.76" stop-color="#f97316"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <marker id="arrow-fixed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111827"/>
    </marker>
    <marker id="arrow-adapt" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-grad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 22px; fill: #111827; font-weight: 700; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; fill: #52525b; }
      .panel-title { font-family: Arial, sans-serif; font-size: 16px; fill: #111827; font-weight: 700; }
      .label { font-family: Arial, sans-serif; font-size: 13px; fill: #111827; font-weight: 600; }
      .note { font-family: Arial, sans-serif; font-size: 12px; fill: #52525b; }
      .axis { stroke: #374151; stroke-width: 1.4; fill: none; }
      .grid { stroke: #e5e7eb; stroke-width: 1; fill: none; }
      .mesh { stroke: rgba(55,65,81,0.22); stroke-width: 1; fill: none; }
      .contour-low { stroke: #2563eb; stroke-width: 2.2; fill: none; }
      .contour-mid { stroke: #06b6d4; stroke-width: 1.8; fill: none; }
      .contour-high { stroke: #f59e0b; stroke-width: 1.7; fill: none; }
      .contour-very-high { stroke: #dc2626; stroke-width: 1.6; fill: none; }
      .path-fixed { fill: none; stroke: #111827; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-fixed); }
      .path-adapt { fill: none; stroke: #7c3aed; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-adapt); }
      .path-grad { fill: none; stroke: #059669; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-grad); }
    </style>
  </defs>

  <text x="450" y="32" text-anchor="middle" class="title">Rosenbrock 函数：曲面与等高线</text>
  <text x="450" y="58" text-anchor="middle" class="subtitle">左图看狭长弯谷，右图看搜索路线为什么容易在谷壁间来回修正</text>

  <g transform="translate(40,86)">
    <text x="170" y="0" text-anchor="middle" class="panel-title">伪 3D 曲面</text>
    <path d="M34 352 L95 122 L341 34 L390 298 Z" fill="#f8fafc" stroke="#e5e7eb"/>
    <path d="M34 352 L390 298" class="axis"/>
    <path d="M34 352 L95 122" class="axis"/>
    <path d="M95 122 L341 34" class="axis"/>
    <path d="M58 322 C111 250, 171 199, 246 165 C300 140, 346 151, 379 209 L390 298 C337 253, 281 241, 221 268 C153 299, 97 324, 58 322 Z" fill="url(#surface-hot)" opacity="0.95"/>
    <path d="M82 285 C132 245, 185 218, 240 207 C292 197, 327 210, 355 242 C318 249, 282 265, 246 287 C192 319, 130 316, 82 285 Z" fill="url(#surface-cool)" opacity="0.9"/>
    <path d="M70 316 C121 280, 177 250, 240 226 C289 208, 332 210, 369 231" class="mesh"/>
    <path d="M87 273 C141 232, 201 203, 267 190 C312 181, 348 190, 380 214" class="mesh"/>
    <path d="M106 231 C161 189, 224 162, 290 153 C329 148, 363 158, 391 184" class="mesh"/>
    <path d="M125 188 C181 148, 242 124, 305 118 C339 115, 370 126, 397 151" class="mesh"/>
    <path d="M95 122 C136 183, 163 247, 176 318" class="mesh"/>
    <path d="M155 99 C190 163, 209 229, 211 300" class="mesh"/>
    <path d="M217 77 C244 145, 254 215, 242 292" class="mesh"/>
    <path d="M280 55 C299 130, 298 205, 271 290" class="mesh"/>
    <path d="M341 34 C350 112, 337 194, 302 292" class="mesh"/>
    <path d="M96 286 C142 268, 185 244, 226 225 C270 204, 318 210, 350 240" stroke="#1d4ed8" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="355" cy="242" r="6" fill="#dc2626"/>
    <text x="366" y="236" class="label">极小点</text>
    <text x="116" y="376" class="note">蓝色沟槽表示低函数值区域</text>
  </g>

  <g transform="translate(500,86)">
    <text x="170" y="0" text-anchor="middle" class="panel-title">等高线与搜索路线</text>
    <rect x="0" y="28" width="340" height="340" fill="#ffffff" stroke="#d1d5db"/>
    <path d="M85 28 V368 M170 28 V368 M255 28 V368 M0 113 H340 M0 198 H340 M0 283 H340" class="grid"/>
    <path d="M0 368 H340 M0 28 V368" class="axis"/>
    <text x="338" y="386" text-anchor="end" class="note">x</text>
    <text x="-8" y="38" text-anchor="end" class="note">y</text>
    <path d="M15 330 C75 286, 127 252, 170 226 C214 200, 253 193, 309 198" class="contour-very-high"/>
    <path d="M18 302 C79 267, 130 238, 172 218 C214 198, 251 194, 320 211" class="contour-high"/>
    <path d="M24 276 C84 248, 133 226, 174 210 C216 195, 252 198, 326 229" class="contour-high"/>
    <path d="M37 253 C93 231, 139 215, 177 205 C217 194, 251 204, 319 248" class="contour-mid"/>
    <path d="M55 233 C106 216, 146 206, 180 202 C216 198, 247 212, 303 264" class="contour-mid"/>
    <path d="M82 216 C124 204, 156 199, 184 201 C217 204, 241 223, 279 278" class="contour-low"/>
    <path d="M115 207 C148 201, 172 200, 193 206 C220 214, 238 236, 260 285" class="contour-low"/>
    <path d="M147 204 C171 203, 189 207, 204 216 C222 227, 235 248, 247 291" class="contour-low"/>
    <path d="M34 198 L79 249 L68 223 L124 274 L102 242 L166 264 L146 234 L205 250 L190 225 L250 225 L255 198" class="path-fixed"/>
    <path d="M34 198 L78 248 L62 216 L121 264 L96 232 L158 251 L134 219 L202 236 L182 213 L234 207 L255 198" class="path-grad"/>
    <path d="M34 198 C76 229, 111 232, 145 219 C181 205, 214 198, 255 198" class="path-adapt"/>
    <circle cx="34" cy="198" r="5" fill="#111827"/>
    <text x="22" y="185" class="label">起点</text>
    <circle cx="255" cy="198" r="7" fill="#dc2626"/>
    <text x="268" y="191" class="label">极小点 (1,1)</text>
    <line x1="0" y1="405" x2="48" y2="405" stroke="#111827" stroke-width="3.2" stroke-linecap="round"/>
    <text x="60" y="409" class="note">A 固定坐标试探</text>
    <line x1="0" y1="430" x2="48" y2="430" stroke="#059669" stroke-width="3.2" stroke-linecap="round"/>
    <text x="60" y="434" class="note">C 梯度方法</text>
    <line x1="178" y1="405" x2="226" y2="405" stroke="#7c3aed" stroke-width="3.6" stroke-linecap="round"/>
    <text x="238" y="409" class="note">B 方向调整</text>
    <rect x="178" y="424" width="118" height="10" fill="url(#legend)" rx="2"/>
    <text x="304" y="434" class="note">低到高</text>
  </g>
</svg>
