<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="title desc">
  <title id="title">Convex function below the chord</title>
  <desc id="desc">A one-dimensional convex function with two points connected by a chord. The graph of the function lies below the chord between the two points.</desc>
  <rect width="780" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arrow-axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#52525b"/>
    </marker>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 21px; fill: #111827; font-weight: 700; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; fill: #52525b; }
      .axis { stroke: #52525b; stroke-width: 1.4; marker-end: url(#arrow-axis); }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .curve { fill: none; stroke: #2563eb; stroke-width: 4; }
      .chord { stroke: #f97316; stroke-width: 3.2; }
      .guide { stroke: #71717a; stroke-width: 1.4; stroke-dasharray: 6 6; }
      .gap { stroke: #dc2626; stroke-width: 3; stroke-dasharray: 5 5; }
      .point { fill: #111827; stroke: #ffffff; stroke-width: 2; }
      .point-blue { fill: #2563eb; stroke: #ffffff; stroke-width: 2; }
      .point-orange { fill: #f97316; stroke: #ffffff; stroke-width: 2; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #111827; }
      .label-muted { font-family: Arial, sans-serif; font-size: 13px; fill: #52525b; }
      .label-blue { font-family: Arial, sans-serif; font-size: 14px; fill: #2563eb; font-weight: 700; }
      .label-orange { font-family: Arial, sans-serif; font-size: 14px; fill: #f97316; font-weight: 700; }
      .label-red { font-family: Arial, sans-serif; font-size: 14px; fill: #dc2626; font-weight: 700; }
      .formula { font-family: Arial, sans-serif; font-size: 17px; fill: #111827; }
    </style>
  </defs>

  <text x="390" y="34" text-anchor="middle" class="title">凸函数：图像在弦线下方</text>
  <text x="390" y="60" text-anchor="middle" class="subtitle">两个点之间的曲线不会高过连接端点的直线</text>

  <g transform="translate(70,82)">
    <rect x="0" y="0" width="470" height="320" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
    <line x1="40" y1="280" x2="430" y2="280" class="axis"/>
    <line x1="40" y1="292" x2="40" y2="38" class="axis"/>
    <text x="436" y="284" class="label-muted">x</text>
    <text x="28" y="30" class="label-muted">f(x)</text>

    <line x1="40" y1="220" x2="430" y2="220" class="grid"/>
    <line x1="40" y1="160" x2="430" y2="160" class="grid"/>
    <line x1="40" y1="100" x2="430" y2="100" class="grid"/>
    <line x1="120" y1="40" x2="120" y2="280" class="grid"/>
    <line x1="300" y1="40" x2="300" y2="280" class="grid"/>

    <!-- Convex curve, roughly y = (x-235)^2. -->
    <path d="M80 95 C128 160, 172 212, 220 236 C260 256, 308 230, 360 150 C386 110, 405 78, 420 54" class="curve"/>

    <!-- Chord between two selected points. -->
    <line x1="120" y1="150" x2="360" y2="150" class="chord"/>
    <circle cx="120" cy="150" r="6.5" class="point"/>
    <circle cx="360" cy="150" r="6.5" class="point"/>
    <text x="94" y="137" class="label">x</text>
    <text x="366" y="137" class="label">y</text>

    <!-- Middle point. -->
    <line x1="240" y1="280" x2="240" y2="236" class="guide"/>
    <line x1="240" y1="236" x2="240" y2="150" class="gap"/>
    <circle cx="240" cy="236" r="6.5" class="point-blue"/>
    <circle cx="240" cy="150" r="6.5" class="point-orange"/>
    <text x="200" y="300" class="label-muted">tx+(1-t)y</text>
    <text x="250" y="242" class="label-blue">函数值</text>
    <text x="250" y="144" class="label-orange">弦线上的值</text>
    <text x="252" y="196" class="label-red">差距 >= 0</text>
  </g>

  <g transform="translate(568,122)">
    <rect x="0" y="0" width="160" height="176" rx="6" fill="#f8fafc" stroke="#e5e7eb"/>
    <text x="16" y="34" class="formula">f(tx+(1-t)y)</text>
    <text x="72" y="64" class="formula">≤</text>
    <text x="16" y="94" class="formula">t f(x)+(1-t)f(y)</text>
    <text x="16" y="132" class="label-muted">左边是曲线上的点，</text>
    <text x="16" y="154" class="label-muted">右边是弦线上的点。</text>
  </g>
</svg>
