<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Simple residual block</title>
  <desc id="desc">A simple residual block sends input x through a learned transform F and an identity path I, then adds the two results to produce x plus F of x.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <style>
      .panel { fill: #f8faf9; stroke: #cfd8d3; stroke-width: 1.5; rx: 8; }
      .title { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2a2e; }
      .small { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #53636a; }
      .label { font: 600 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #253238; }
      .formula { font: 600 20px "Times New Roman", serif; fill: #263238; }
      .node { fill: #ffffff; stroke: #2f6f73; stroke-width: 2; }
      .block { fill: #ffffff; stroke: #4c6b8a; stroke-width: 2; rx: 8; }
      .add { fill: #fff8e7; stroke: #b68122; stroke-width: 2; }
      .line { stroke: #263238; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .skip { stroke: #7b8b91; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="24" y="24" width="852" height="350" class="panel"/>
  <text x="58" y="68" class="title">最简单的残差块</text>
  <text x="58" y="98" class="small">一条路学习改动 F(x)，另一条路保留原输入 x，最后相加。</text>

  <circle cx="92" cy="205" r="22" class="node"/>
  <text x="84" y="212" class="formula">x</text>

  <rect x="250" y="138" width="150" height="64" class="block"/>
  <text x="317" y="169" class="formula">F</text>
  <text x="289" y="192" class="small">学习路径</text>

  <circle cx="560" cy="205" r="25" class="add"/>
  <text x="553" y="212" class="formula">+</text>

  <circle cx="720" cy="205" r="22" class="node"/>
  <text x="713" y="212" class="formula">y</text>
  <text x="632" y="270" class="formula">y = x + F(x)</text>

  <path d="M114 205 C155 174, 197 170, 246 170" class="line"/>
  <path d="M400 170 C462 170, 501 193, 536 202" class="line"/>
  <path d="M585 205 H698" class="line"/>

  <path d="M114 205 C235 314, 418 314, 536 215" class="skip"/>
  <text x="285" y="348" class="small">恒等路径 I：什么都不改，直接传过去</text>
</svg>
