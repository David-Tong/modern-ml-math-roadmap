<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">Standard ResNet residual learning block</title>
  <desc id="desc">A standard ResNet building block with two weight layers, ReLU activations, an identity shortcut, and an addition operator.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <style>
      .panel { fill: #f8faf9; stroke: #cfd8d3; stroke-width: 1.5; rx: 8; }
      .title { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2a2e; }
      .small { font: 400 14px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #53636a; }
      .label { font: 600 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #253238; }
      .formula { font: 600 19px "Times New Roman", serif; fill: #263238; }
      .block { fill: #ffffff; stroke: #4c6b8a; stroke-width: 2; rx: 7; }
      .relu { fill: #f0fbf6; stroke: #2f6f73; stroke-width: 2; rx: 7; }
      .add { fill: #fff8e7; stroke: #b68122; stroke-width: 2; }
      .main { stroke: #263238; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .skip { stroke: #7b8b91; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #b8c4c0; stroke-width: 1.6; stroke-dasharray: 7 7; fill: none; rx: 10; }
    </style>
  </defs>

  <rect x="26" y="26" width="708" height="500" class="panel"/>
  <text x="64" y="72" class="title">ResNet 标准残差块示意图</text>
  <text x="64" y="102" class="small">主路径学习 F(x)，捷径路径把 x 原样送到加法处，最后得到 F(x) + x。</text>

  <rect x="230" y="135" width="220" height="300" class="dash"/>

  <text x="118" y="460" class="formula">x</text>
  <path d="M135 452 H250" class="main"/>

  <rect x="250" y="426" width="180" height="50" class="block"/>
  <text x="296" y="457" class="label">weight layer</text>

  <path d="M340 426 V390" class="main"/>
  <rect x="280" y="340" width="120" height="50" class="relu"/>
  <text x="318" y="371" class="label">ReLU</text>

  <path d="M340 340 V304" class="main"/>
  <rect x="250" y="254" width="180" height="50" class="block"/>
  <text x="296" y="285" class="label">weight layer</text>

  <path d="M340 254 V220" class="main"/>
  <circle cx="340" cy="184" r="24" class="add"/>
  <text x="333" y="191" class="formula">+</text>

  <path d="M340 160 V130" class="main"/>
  <rect x="280" y="80" width="120" height="50" class="relu"/>
  <text x="318" y="111" class="label">ReLU</text>

  <path d="M340 80 V56" class="main"/>
  <text x="315" y="48" class="formula">F(x) + x</text>

  <path d="M135 452 C580 452, 590 184, 367 184" class="skip"/>
  <text x="498" y="330" class="small">identity shortcut</text>
  <text x="498" y="354" class="small">直接传递 x</text>

  <text x="455" y="214" class="small">加法汇合</text>
  <text x="250" y="500" class="small">虚线框里的两层学习 residual mapping：F(x)</text>
</svg>
