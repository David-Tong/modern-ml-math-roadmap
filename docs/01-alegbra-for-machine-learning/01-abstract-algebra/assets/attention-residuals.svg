<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Attention Residuals connect many previous layers</title>
  <desc id="desc">All previous layer representations are projected to the same width. Attention Residuals let the current layer learn weights over representations from different depths.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#263238"/>
    </marker>
    <style>
      .bg { fill: #f8faf9; stroke: #cfd8d3; stroke-width: 1.5; rx: 8; }
      .title { font: 700 25px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #1f2a2e; }
      .label { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #253238; }
      .small { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #566970; }
      .formula { font: 600 20px "Times New Roman", serif; fill: #263238; }
      .layer { fill: #eef6ff; stroke: #4c6b8a; stroke-width: 2; rx: 8; }
      .attn { fill: #f0fbf6; stroke: #2f6f73; stroke-width: 2.2; rx: 8; }
      .out { fill: #fff8e7; stroke: #b68122; stroke-width: 2.2; rx: 8; }
      .note { fill: #ffffff; stroke: #d8e0dc; stroke-width: 1.4; rx: 8; }
      .line { stroke: #263238; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #6f7f86; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #9aa8ad; stroke-width: 1.7; stroke-dasharray: 7 7; fill: none; }
    </style>
  </defs>

  <rect x="24" y="24" width="1032" height="500" class="bg"/>
  <text x="58" y="70" class="title">Attention Residuals：从“只接上一层”到“选择多层历史”</text>

  <rect x="70" y="100" width="300" height="70" class="note"/>
  <text x="94" y="130" class="label">普通残差</text>
  <text x="94" y="154" class="small">主要连接相邻层：上一层 + 当前改动</text>

  <rect x="410" y="100" width="430" height="70" class="note"/>
  <text x="434" y="130" class="label">Attention Residuals</text>
  <text x="434" y="154" class="small">当前层可以从多个历史层表示中学习取用</text>

  <text x="92" y="220" class="label">不同深度的历史表示</text>
  <text x="92" y="246" class="small">语义不同，但都被放回同一个宽度 d</text>

  <text x="505" y="220" class="label">深度 attention</text>
  <text x="505" y="246" class="small">给每一层历史表示分配权重</text>

  <text x="815" y="220" class="label">新的当前层表示</text>
  <text x="815" y="246" class="small">仍然是宽度 d，可以继续往下传</text>

  <rect x="90" y="285" width="260" height="52" class="layer"/>
  <text x="118" y="318" class="formula">v<tspan baseline-shift="sub" font-size="13">0</tspan></text>
  <text x="185" y="318" class="small">浅层表示，宽度 d</text>

  <rect x="90" y="355" width="260" height="52" class="layer"/>
  <text x="118" y="388" class="formula">v<tspan baseline-shift="sub" font-size="13">1</tspan></text>
  <text x="185" y="388" class="small">中间层表示，宽度 d</text>

  <rect x="90" y="425" width="260" height="52" class="layer"/>
  <text x="118" y="458" class="formula">v<tspan baseline-shift="sub" font-size="13">l-1</tspan></text>
  <text x="185" y="458" class="small">更深历史表示，宽度 d</text>

  <path d="M380 311 H470" class="dash"/>
  <path d="M380 381 H470" class="dash"/>
  <path d="M380 451 H470" class="dash"/>
  <text x="390" y="270" class="small">宽度对齐后才能相加</text>

  <rect x="500" y="335" width="190" height="86" class="attn"/>
  <text x="540" y="370" class="label">attention</text>
  <text x="532" y="395" class="small">学习 alpha_0, alpha_1, ...</text>

  <path d="M350 311 C420 311, 445 350, 497 360" class="soft"/>
  <path d="M350 381 H497" class="soft"/>
  <path d="M350 451 C420 451, 445 410, 497 398" class="soft"/>

  <rect x="785" y="340" width="210" height="76" class="out"/>
  <text x="826" y="372" class="formula">x_new</text>
  <text x="813" y="398" class="small">加权合成后的表示</text>
  <path d="M690 378 H782" class="line"/>

  <text x="735" y="462" class="formula">x_new = sum alpha_i v_i</text>
  <text x="90" y="512" class="small">核心：以前的残差更像“相邻层接力”；Attention Residuals 让当前层沿深度方向选择多个历史层的信息。</text>
</svg>
