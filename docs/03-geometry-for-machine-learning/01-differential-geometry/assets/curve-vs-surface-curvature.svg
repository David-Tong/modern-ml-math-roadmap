<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">曲线曲率和曲面曲率的直观对比</title>
  <desc id="desc">左侧展示曲线上的切线方向随弧长变化，右侧展示曲面上的切平面和法向量随小面积变化。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="0.55" stop-color="#bfdbfe"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" fill="#ffffff"/>

  <text x="240" y="38" text-anchor="middle" font-size="24" font-family="Microsoft YaHei, SimHei, Arial" font-weight="700" fill="#111827">曲线：看切线方向怎么变</text>
  <text x="720" y="38" text-anchor="middle" font-size="24" font-family="Microsoft YaHei, SimHei, Arial" font-weight="700" fill="#111827">曲面：看切平面和法向量怎么变</text>

  <line x1="480" y1="66" x2="480" y2="392" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Left panel: curve and tangent directions -->
  <path d="M70 300 C130 210, 205 180, 260 230 C310 275, 360 245, 410 140" fill="none" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <circle cx="180" cy="204" r="7" fill="#111827"/>
  <circle cx="326" cy="253" r="7" fill="#111827"/>

  <line x1="135" y1="222" x2="230" y2="184" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <line x1="285" y1="267" x2="370" y2="229" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <path d="M182 214 C210 238, 246 249, 300 253" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 7"/>
  <text x="240" y="286" text-anchor="middle" font-size="18" font-family="Microsoft YaHei, SimHei, Arial" fill="#92400e">沿曲线走过的小长度 ds</text>

  <text x="117" y="177" font-size="18" font-family="Microsoft YaHei, SimHei, Arial" fill="#2563eb">切线方向 1</text>
  <text x="340" y="218" font-size="18" font-family="Microsoft YaHei, SimHei, Arial" fill="#2563eb">切线方向 2</text>
  <text x="238" y="345" text-anchor="middle" font-size="18" font-family="Microsoft YaHei, SimHei, Arial" fill="#374151">曲线曲率看的是：</text>
  <text x="238" y="372" text-anchor="middle" font-size="18" font-family="Microsoft YaHei, SimHei, Arial" fill="#374151">切线方向变化 / 曲线长度变化</text>

  <!-- Right panel: surface, tangent planes, normals -->
  <path d="M560 272 C610 210, 690 198, 765 220 C835 241, 880 216, 920 170 L920 310 C860 360, 760 360, 675 332 C620 314, 580 325, 540 356 Z" fill="url(#surface)" stroke="#2563eb" stroke-width="3"/>
  <path d="M570 294 C635 246, 720 239, 800 258 C845 268, 880 254, 910 220" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.75"/>
  <path d="M590 330 C650 292, 725 287, 790 304 C835 316, 870 302, 905 270" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.65"/>

  <ellipse cx="655" cy="265" rx="78" ry="26" fill="#fef3c7" stroke="#d97706" stroke-width="2" opacity="0.92"/>
  <ellipse cx="805" cy="238" rx="76" ry="25" fill="#fef3c7" stroke="#d97706" stroke-width="2" opacity="0.92" transform="rotate(-13 805 238)"/>

  <circle cx="655" cy="265" r="6" fill="#111827"/>
  <circle cx="805" cy="238" r="6" fill="#111827"/>

  <line x1="655" y1="265" x2="630" y2="160" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)"/>
  <line x1="805" y1="238" x2="842" y2="135" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow-red)"/>

  <path d="M660 279 C700 286, 735 277, 790 248" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 7"/>
  <text x="728" y="318" text-anchor="middle" font-size="18" font-family="Microsoft YaHei, SimHei, Arial" fill="#92400e">曲面上的小面积</text>

  <text x="580" y="152" font-size="18" font-family="Microsoft YaHei, SimHei, Arial" fill="#dc2626">法向量 1</text>
  <text x="818" y="124" font-size="18" font-family="Microsoft YaHei, SimHei, Arial" fill="#dc2626">法向量 2</text>
  <text x="605" y="232" font-size="18" font-family="Microsoft YaHei, SimHei, Arial" fill="#92400e">切平面 1</text>
  <text x="815" y="214" font-size="18" font-family="Microsoft YaHei, SimHei, Arial" fill="#92400e">切平面 2</text>

  <text x="720" y="345" text-anchor="middle" font-size="18" font-family="Microsoft YaHei, SimHei, Arial" fill="#374151">高斯曲率的直觉是：</text>
  <text x="720" y="372" text-anchor="middle" font-size="18" font-family="Microsoft YaHei, SimHei, Arial" fill="#374151">法向量方向变化 / 曲面面积变化</text>
</svg>
